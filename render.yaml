services:
  - type: web
    name: koshkakan-marketplace
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/koshkakan.db
    disk:
      name: koshkakan-data
      mountPath: /var/data
      sizeGB: 1
